name = "monolith-daily"
main = "worker.js"
compatibility_date = "2026-10-01"
[triggers]
crons = ["7 6 * * *", "7 12 * * *", "7 18 * * *", "*/5 * * * *"]   # UTC: 09:07, 15:07, 21:07 Istanbul + the auto-post check
[vars]
GH_REPO = "5a7a/monolith-daily"
TG_ADMIN_ID = "YOUR_TELEGRAM_USER_ID"
AUTO_POST_MINUTES = "30"
[[kv_namespaces]]
binding = "STATE"
id = "YOUR_KV_NAMESPACE_ID"
