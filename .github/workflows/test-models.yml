name: test-models
on: workflow_dispatch
permissions: { contents: read, models: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - env: { T: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          for u in https://models.github.ai/inference/chat/completions; do
            curl -sS -i "$u" -H "Authorization: Bearer $T" -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
              -d '{"model":"openai/gpt-4.1","messages":[{"role":"user","content":"Say hi in JSON {\"hi\":\"...\"}"}],"response_format":{"type":"json_object"}}' | head -c 1500; echo
          done
