name: test-vision
on: workflow_dispatch
permissions: { contents: read }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - name: Groq models
        env: { K: '${{ secrets.GROQ_API_KEY }}' }
        run: |
          curl -s https://api.groq.com/openai/v1/models -H "Authorization: Bearer $K" -H "User-Agent: Mozilla/5.0" | python3 -c "import json,sys; print('\n'.join(sorted(m['id'] for m in json.load(sys.stdin)['data'])))"
      - name: Photo check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cd pipeline && python - <<'PY'
          import photos, feed, os
          for a in [x for x in feed.candidates(24, 20) if x.get('image')]:
              photos.KNOWN[a['url']] = a['image']; img, _ = photos.fetch([a['url']], '/tmp/p.jpg')
              if img: break
          print('headline:', a['title'])
          ALL = ['GEMINI_API_KEY', 'GROQ_API_KEY', 'OPENROUTER_API_KEY']; keep = {k: os.environ[k] for k in ALL if k in os.environ}
          for key in ALL:
              for k in ALL: os.environ.pop(k, None)
              os.environ[key] = keep[key]
              print(key, 'right headline ->', photos.screen(img, a['title']))
              print(key, 'wrong headline ->', photos.screen(img, 'Apple unveils a new iPhone at an event in California'))
          PY
