name: test-vision
on: workflow_dispatch
permissions: { contents: read }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env: { K: '${{ secrets.GROQ_API_KEY }}' }
        run: curl -s https://api.groq.com/openai/v1/models -H "Authorization: Bearer $K" -H "User-Agent: Mozilla/5.0" | python3 -c "import json,sys; print('\n'.join(sorted(m['id'] for m in json.load(sys.stdin)['data'])))"
