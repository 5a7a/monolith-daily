name: test-ig
on:
  workflow_dispatch:
    inputs:
      run_id: { description: 'episode run id', required: true }
permissions: { actions: read, contents: read }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: episode, path: out, run-id: '${{ inputs.run_id }}', github-token: '${{ github.token }}' }
      - run: ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,sample_rate,channels,bit_rate:format=duration,size,bit_rate -of compact out/episode.mp4 || true
      - run: |
          mkdir -p ~/ff && curl -sSfL --retry 5 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz && tar -xJf /tmp/ff.tar.xz -C ~/ff --strip-components=1 && export PATH=~/ff/bin:$PATH
          ffmpeg -v error -y -i out/episode.mp4 -c:v libx264 -preset veryfast -b:v 3500k -maxrate 4000k -bufsize 8000k -pix_fmt yuv420p -c:a aac -b:a 128k -ar 48000 -ac 2 -movflags +faststart out/ig.mp4 && ls -la out/ig.mp4 && mv out/ig.mp4 out/episode.mp4
      - env: { IG_TOKEN: '${{ secrets.IG_TOKEN }}', IG_USER_ID: '${{ secrets.IG_USER_ID }}', IG_DRY: '1' }
        run: python pipeline/instagram.py out
