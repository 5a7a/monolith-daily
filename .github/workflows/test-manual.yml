name: test-manual
on:
  workflow_dispatch:
    inputs:
      run_id: { description: 'episode run id', required: true }
permissions: { actions: read, contents: read }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: episode, path: out, run-id: '${{ inputs.run_id }}', github-token: '${{ github.token }}' }
      - env: { TG_BOT_TOKEN: '${{ secrets.TG_BOT_TOKEN }}', TG_CHAT_ID: '${{ secrets.TG_CHAT_ID }}' }
        run: python pipeline/telegram.py manual out
