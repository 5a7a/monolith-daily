name: publish
on:
  repository_dispatch: { types: [publish] }   # fired by the Telegram "Publish" button (client_payload.run_id)
permissions: { actions: read, contents: write }
concurrency: { group: 'publish-${{ github.event.client_payload.run_id }}', cancel-in-progress: false }   # one at a time per episode
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Only recent episodes (an old or test video can't go out by tapping an old button)
        env: { GH_TOKEN: '${{ github.token }}', TG_BOT_TOKEN: '${{ secrets.TG_BOT_TOKEN }}', TG_CHAT_ID: '${{ secrets.TG_CHAT_ID }}' }
        run: |
          made=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.event.client_payload.run_id }} --jq .created_at)
          age=$(( ( $(date +%s) - $(date -d "$made" +%s) ) / 3600 ))
          if [ "$age" -ge 12 ]; then
            curl -sS "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" -d chat_id="$TG_CHAT_ID" --data-urlencode text="ℹ️ Not posted: that episode is ${age}h old. Only episodes from the last 12 hours can be published." >/dev/null
            echo "SKIP=1" >> $GITHUB_ENV
          fi
      - name: Instagram connected yet?
        if: env.SKIP != '1'
        env: { IG_TOKEN: '${{ secrets.IG_TOKEN }}', TG_BOT_TOKEN: '${{ secrets.TG_BOT_TOKEN }}', TG_CHAT_ID: '${{ secrets.TG_CHAT_ID }}' }
        run: |
          if [ -z "$IG_TOKEN" ]; then
            curl -sS "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" -d chat_id="$TG_CHAT_ID" --data-urlencode text="ℹ️ Would have posted now, but Instagram isn't connected yet. Nothing was posted." >/dev/null
            echo "SKIP=1" >> $GITHUB_ENV
          fi
      - if: env.SKIP != '1'
        uses: actions/checkout@v4
      - if: env.SKIP != '1'
        uses: actions/download-artifact@v4
        with: { name: episode, path: out, run-id: '${{ github.event.client_payload.run_id }}', github-token: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Post the Reel
        if: env.SKIP != '1'
        env: { IG_TOKEN: '${{ secrets.IG_TOKEN }}', IG_USER_ID: '${{ secrets.IG_USER_ID }}' }
        run: python pipeline/instagram.py out
      - name: Remember the stories it covered (so the next episodes don't repeat them)
        if: success() && env.SKIP != '1'
        run: |
          python - <<'PY'
          import json, datetime as dt
          h = json.load(open('pipeline/history.json')); new = json.load(open('out/covered.json'))
          cut = dt.datetime.now(dt.timezone.utc) - dt.timedelta(hours=48)
          h = [x for x in h if dt.datetime.fromisoformat(x['t']) > cut] + [x for x in new if x['title'] not in {y['title'] for y in h}]
          json.dump(h, open('pipeline/history.json', 'w'), ensure_ascii=False, indent=1)
          PY
          git config user.name "monolith-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do git add pipeline/history.json && git commit -qm "Covered stories" ; git pull --rebase -q && git push -q && break; sleep 10; done
      - name: If posting failed, send the video and caption for posting by hand
        if: failure() && env.SKIP != '1'
        env: { TG_BOT_TOKEN: '${{ secrets.TG_BOT_TOKEN }}', TG_CHAT_ID: '${{ secrets.TG_CHAT_ID }}' }
        run: python pipeline/telegram.py manual out
      - name: Confirm
        if: always() && env.SKIP != '1'
        env: { TG_BOT_TOKEN: '${{ secrets.TG_BOT_TOKEN }}', TG_CHAT_ID: '${{ secrets.TG_CHAT_ID }}' }
        run: |
          python pipeline/telegram.py say "${{ job.status == 'success' && 'Posted ✅' || 'Posting failed ❌ check the publish run in GitHub Actions' }} $(cat out/published.txt 2>/dev/null)"
