name: make-episode
on:
  repository_dispatch: { types: [make-episode] }   # fired by the Cloudflare Worker on schedule, or by the Redo button
  workflow_dispatch:
    inputs:
      test: { description: 'Test run: send to Telegram marked TEST, never posts', type: boolean, default: false }
concurrency: { group: episode, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - name: Cache models (Pocket TTS, Whisper, Kokoro)
        uses: actions/cache@v4
        with: { path: "~/.cache/huggingface\nmodels", key: voice-models-v3 }
      - name: Download Kokoro (first run only)
        run: |
          mkdir -p models
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -f models/$f ] || curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o models/$f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f
          done
      - name: Cache ffmpeg
        uses: actions/cache@v4
        with: { path: ~/ffmpeg, key: ffmpeg-static-v1 }
      - name: ffmpeg (ready-made build; apt only if that fails)
        run: |
          if [ ! -x ~/ffmpeg/bin/ffmpeg ]; then
            mkdir -p ~/ffmpeg && curl -sSfL --retry 5 --retry-all-errors -m 300 -o /tmp/ff.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              && tar -xJf /tmp/ff.tar.xz -C ~/ffmpeg --strip-components=1 || rm -rf ~/ffmpeg/*
          fi
          if [ -x ~/ffmpeg/bin/ffmpeg ]; then echo "$HOME/ffmpeg/bin" >> $GITHUB_PATH
          else timeout 600 bash -c 'sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg'; fi
      - name: Install (locked versions, retried if a download fails)
        run: |
          for i in 1 2 3; do
            pip install -q torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu && pip install -q -r requirements.txt && break
            echo "install failed, retrying"; sleep 30
          done
          python -c "import torch, kokoro_onnx, faster_whisper, pocket_tts"
      - name: Download voice models (retried)
        run: |
          for i in 1 2 3; do
            python -c "from pocket_tts import TTSModel; TTSModel.load_model()" && python -c "from faster_whisper import WhisperModel; WhisperModel('base.en', device='cpu', compute_type='int8'); WhisperModel('small.en', device='cpu', compute_type='int8')" && break
            echo "model download failed, retrying"; sleep 30
          done
      - name: Build episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN || secrets.CF_API_TOKEN }}
        run: python pipeline/run.py out
      - name: AI check + automatic fixes (up to 4 rounds)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN || secrets.CF_API_TOKEN }}
        run: |
          python pipeline/review.py out
          for round in 1 2 3 4; do
            if [ $SECONDS -gt 2400 ]; then echo "out of time for more fix rounds"; break; fi   # ~15 min per round: episode stays on time
            python -c "import json,sys; sys.exit(0 if json.load(open('out/review.json'))['ok'] else 1)" && break
            python pipeline/autofix.py out $round || break
            python pipeline/run.py out --script out/script.json --fixes out/fixes.json
            python pipeline/review.py out
          done
      - name: Remember pronunciations and covered stories
        if: always()
        run: |
          if ! git diff --quiet pipeline/learned_say.json pipeline/pronunciations.json; then
            git config user.name "monolith-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pipeline/learned_say.json pipeline/pronunciations.json && git commit -m "Remember pronunciations and covered stories" && git pull --rebase -q && git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: episode
          retention-days: 7
          path: |
            out/
            !out/v*.mp4
            !out/mix.wav
            !out/still_*.png
      - name: Send to Telegram for approval
        env: { TG_BOT_TOKEN: '${{ secrets.TG_BOT_TOKEN }}', TG_CHAT_ID: '${{ secrets.TG_CHAT_ID }}', WORKER_URL: '${{ secrets.WORKER_URL }}', PIPE_SECRET: '${{ secrets.PIPE_SECRET }}', AUTO_POST_MINUTES: '30' }
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then export WORKER_URL=none TEST_RUN=1; fi
          python pipeline/telegram.py review out ${{ github.run_id }}
      - name: Report failure
        if: failure() || cancelled()
        env: { TG_BOT_TOKEN: '${{ secrets.TG_BOT_TOKEN }}', TG_CHAT_ID: '${{ secrets.TG_CHAT_ID }}' }
        run: |
          python pipeline/telegram.py say "Episode failed. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
