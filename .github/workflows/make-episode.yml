name: make-episode
on:
  repository_dispatch: { types: [make-episode] }   # fired by the Cloudflare Worker on schedule, or by the Redo button
  workflow_dispatch: {}
concurrency: { group: episode, cancel-in-progress: false }
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - name: Cache models (Pocket TTS, Whisper, Kokoro)
        uses: actions/cache@v4
        with: { path: "~/.cache/huggingface\nmodels", key: voice-models-v2 }
      - name: Download Kokoro (first run only)
        run: |
          mkdir -p models
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -f models/$f ] || curl -sSfL -o models/$f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f
          done
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q -r requirements.txt
      - name: Build episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
        run: python pipeline/run.py out
      - name: AI check of the finished episode (Gemini watches + listens)
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }
        run: python pipeline/review.py out
      - uses: actions/upload-artifact@v4
        with: { name: episode, path: out/, retention-days: 3 }
      - name: Send to Telegram for approval
        env: { TG_BOT_TOKEN: '${{ secrets.TG_BOT_TOKEN }}', TG_CHAT_ID: '${{ secrets.TG_CHAT_ID }}', WORKER_URL: '${{ secrets.WORKER_URL }}', PIPE_SECRET: '${{ secrets.PIPE_SECRET }}', AUTO_POST_MINUTES: '120' }
        run: python pipeline/telegram.py review out ${{ github.run_id }}
      - name: Report failure
        if: failure()
        env: { TG_BOT_TOKEN: '${{ secrets.TG_BOT_TOKEN }}', TG_CHAT_ID: '${{ secrets.TG_CHAT_ID }}' }
        run: |
          python pipeline/telegram.py say "Episode failed. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
